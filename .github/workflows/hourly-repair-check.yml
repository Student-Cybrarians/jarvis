name: Hourly Web Repair Check

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hourly-web-repair-check
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Production build
        run: npm run build

      - name: Run tests
        run: npm test -- --passWithNoTests

      - name: Check for unfinished implementation markers
        shell: bash
        run: |
          if grep -RniE --exclude-dir=node_modules --exclude-dir=.git --exclude-dir=.github --exclude-dir=dist --exclude-dir=coverage --exclude='package-lock.json' \
            '(TODO|FIXME|not implemented|coming soon|placeholder|stub|mock)' .; then
            echo 'Potential unfinished implementation markers found.'
            exit 1
          fi

      - name: Verify Vercel project metadata exists
        shell: bash
        run: |
          if [ ! -f vercel.json ] && [ ! -f .vercel/project.json ]; then
            echo 'No vercel.json or .vercel/project.json found in repository.'
            exit 1
          fi

name: Bootstrap OpenJarvis frontend

on:
  push:
    branches: [master-branch]

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: open-jarvis/OpenJarvis
          ref: main
          path: _openjarvis
      - name: Copy and adapt web frontend
        run: |
          cp -a _openjarvis/frontend/. ./
          python - <<'PY'
          from pathlib import Path
          p = Path('vite.config.ts')
          s = p.read_text()
          s = s.replace("outDir: '../src/openjarvis/server/static'", "outDir: 'dist'")
          p.write_text(s)
          PY
          rm -rf _openjarvis
          cat > vercel.json <<'EOF'
          {
            "buildCommand": "npm run build",
            "outputDirectory": "dist",
            "installCommand": "npm ci",
            "framework": "vite",
            "rewrites": [{ "source": "/(.*)", "destination": "/index.html" }]
          }
          EOF
          cat > README.md <<'EOF'
          # Student-Cybrarians Jarvis Web

          Web frontend adapted from OpenJarvis.

          Set `VITE_API_URL` to the URL of a reachable OpenJarvis API server for browser use.
          EOF
      - name: Commit frontend
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: bootstrap OpenJarvis web frontend' || exit 0
          git push origin HEAD:master-branch
